name: wedding-app

services:
  db:
    image: supabase/postgres:15.8.1.060
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 20

  rest:
    image: postgrest/postgrest:v12.2.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  imgproxy:
    image: darthsim/imgproxy:v3.8.0
    restart: unless-stopped
    environment:
      IMGPROXY_BIND: ":5001"
      IMGPROXY_LOCAL_FILESYSTEM_ROOT: /
      IMGPROXY_USE_ETAG: "true"
      IMGPROXY_ENABLE_WEBP_DETECTION: "true"
      IMGPROXY_MAX_SRC_RESOLUTION: "50"
    volumes:
      - storage-data:/var/lib/storage

  storage:
    image: supabase/storage-api:v1.14.5
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      rest:
        condition: service_started
    environment:
      ANON_KEY: ${ANON_KEY}
      SERVICE_KEY: ${SERVICE_ROLE_KEY}
      PGRST_JWT_SECRET: ${JWT_SECRET}
      DATABASE_URL: postgres://supabase_storage_admin:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-postgres}
      POSTGREST_URL: http://rest:3000
      FILE_SIZE_LIMIT: ${FILE_SIZE_LIMIT:-104857600}
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: wedding
      REGION: local
      GLOBAL_S3_BUCKET: photos
      ENABLE_IMAGE_TRANSFORMATION: "true"
      IMGPROXY_URL: http://imgproxy:5001
    volumes:
      - storage-data:/var/lib/storage

  storage-init:
    image: postgres:16-bookworm
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_started
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./docker/storage-init.sql:/storage-init.sql:ro
    entrypoint:
      - bash
      - -c
      - |
        until psql -h db -U postgres -d ${POSTGRES_DB:-postgres} -c "select 1 from storage.buckets limit 1" > /dev/null 2>&1; do
          echo "waiting for storage migrations"
          sleep 3
        done
        psql -h db -U postgres -d ${POSTGRES_DB:-postgres} -v ON_ERROR_STOP=1 -f /storage-init.sql
    restart: "no"

  gateway:
    image: nginx:1.27-bookworm
    restart: unless-stopped
    depends_on:
      storage:
        condition: service_started
      rest:
        condition: service_started
    volumes:
      - ./docker/gateway.conf:/etc/nginx/conf.d/default.conf:ro
      - render-cache:/var/cache/nginx
    ports:
      - "${GATEWAY_PORT:-8000}:8000"

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_started
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data:
  storage-data:
  render-cache:

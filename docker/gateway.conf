# Public API surface for the self-hosted Supabase. Cloudflare -> caddy -> here.
# The wedding app runs on https://slub.krashu.pl and calls this API on
# https://photos.krashu.pl (cross-origin), so the browser sends a CORS preflight
# (OPTIONS) before uploads. storage-api has no OPTIONS route and emits no CORS
# headers, so we handle CORS here at the gateway.

# Echo the Origin back only for allowed origins (empty -> no ACAO header).
map $http_origin $cors_allow_origin {
    default                    "";
    "https://slub.krashu.pl"   $http_origin;
    "http://localhost:3000"    $http_origin;
    "http://127.0.0.1:3000"    $http_origin;
    # add more app origins here if needed, e.g.:
    # "https://krashu.pl"      $http_origin;
}

# Jeden fragment TUS ma 6 MB. Limity rozkładają duży pik ruchu bez trzymania
# całych filmów w pamięci i zwracają 429, które klient TUS automatycznie ponawia.
limit_conn_zone $server_name zone=upload_global:10m;
limit_conn_zone $binary_remote_addr zone=upload_per_ip:10m;
limit_req_zone $binary_remote_addr zone=upload_rate:10m rate=300r/m;

# Miniatury (/storage/v1/render/) sa generowane przez imgproxy przy kazdym
# zadaniu, wiec trzymamy je w cache nginxa - inaczej kazde przewiniecie galerii
# przez kolejnego goscia przelicza te same pliki od nowa.
proxy_cache_path /var/cache/nginx/render levels=1:2 keys_zone=render:10m
                 max_size=2g inactive=30d use_temp_path=off;

server {
    listen 8000;
    server_name _;

    client_max_body_size 95m;
    proxy_request_buffering off;
    limit_conn_status 429;
    limit_req_status 429;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /storage/v1/render/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_allow_origin always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, range" always;
            add_header Access-Control-Max-Age    86400 always;
            add_header Content-Length 0;
            add_header Content-Type  "text/plain";
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header X-Cache-Status $upstream_cache_status always;

        proxy_cache render;
        proxy_cache_key "$request_uri";
        proxy_cache_valid 200 30d;
        proxy_cache_valid 400 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;

        proxy_pass http://storage:5000/render/;
        proxy_read_timeout 120s;
    }

    location ^~ /storage/v1/upload/resumable {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_allow_origin always;
            add_header Access-Control-Allow-Methods "POST, PATCH, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, tus-resumable, upload-length, upload-metadata, upload-offset, x-upsert" always;
            add_header Access-Control-Expose-Headers "location, tus-resumable, upload-offset, upload-expires" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            add_header Content-Type "text/plain";
            return 204;
        }

        add_header Access-Control-Allow-Origin $cors_allow_origin always;
        add_header Access-Control-Expose-Headers "location, tus-resumable, upload-offset, upload-expires" always;

        client_max_body_size 7m;
        limit_conn upload_global 30;
        limit_conn upload_per_ip 12;
        limit_req zone=upload_rate burst=60 nodelay;

        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://storage:5000/upload/resumable;
        # Storage zna tylko wewnętrzny adres HTTP. Zwracamy klientowi ścieżkę
        # względną, aby kolejne fragmenty szły przez ten sam publiczny gateway.
        proxy_redirect ~^http://[^/]+/upload/resumable/(.*)$ /storage/v1/upload/resumable/$1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /storage/v1/ {
        # Answer the browser preflight here; never forward OPTIONS upstream.
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_allow_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, x-upsert, cache-control, x-requested-with, range" always;
            add_header Access-Control-Max-Age    86400 always;
            add_header Content-Length 0;
            add_header Content-Type  "text/plain";
            return 204;
        }
        add_header Access-Control-Allow-Origin   $cors_allow_origin always;
        add_header Access-Control-Expose-Headers "content-range, content-length, etag" always;

        proxy_pass http://storage:5000/;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /rest/v1/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin  $cors_allow_origin always;
            add_header Access-Control-Allow-Methods "GET, POST, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "authorization, apikey, content-type, x-client-info, prefer, range" always;
            add_header Access-Control-Max-Age    86400 always;
            add_header Content-Length 0;
            add_header Content-Type  "text/plain";
            return 204;
        }
        add_header Access-Control-Allow-Origin $cors_allow_origin always;

        proxy_pass http://rest:3000/;
    }

    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
